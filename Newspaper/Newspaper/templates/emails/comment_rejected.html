<!DOCTYPE html>
<html>
<head>
    <title>Комментарий отклонен</title>

</head>
<body>
    <div class="container">
        <h2>Ваш комментарий отклонен</h2>
        <p>Здравствуйте, {{ comment.user.username }}!</p>

        <p>К сожалению, ваш комментарий к посту
        <a href="{{ site_url }}{{ comment.post.get_absolute_url }}">"{{ comment.post.title }}"</a>
        не прошел модерацию.</p>

        <blockquote style="background: #f9f9f9; padding: 10px; border-left: 3px solid #ccc;">
            {{ comment.text }}
        </blockquote>

        <p>Причина: нарушение правил сообщества.</p>

        <a href="{{ site_url }}/rules/" class="button">
            Правила сообщества
        </a>
    </div>
</body>
</html>
