{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3>Стать автором</h3>
                </div>
                <div class="card-body">
                    <p>Вы получите возможность:</p>
                    <ul>
                        <li>Публиковать новости и статьи</li>
                        <li>Получать уведомления о комментариях</li>
                        <li>Участвовать в рейтинге авторов</li>
                    </ul>
                    <form method="post" action="{% url 'upgrade' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-success btn-lg btn-block">
                            Стать автором
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
